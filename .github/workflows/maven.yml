
name: Running tests with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup the JDK 23
        uses: actions/setup-java@v6
        with:
          java-version: 23
          distribution: 'temurin'
          cache: maven

      - name: Print Java version
        run: java --version

      - name: Running tests with Maven
        run: mvn -B test --file pom.xml
  
